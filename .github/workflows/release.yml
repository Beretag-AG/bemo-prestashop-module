name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/package.sh
      - run: bash scripts/package.sh staging
      - run: bash tests/package-structure.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/bemoliveshopping-*.zip
          generate_release_notes: true
